spring:
  application:
    name: kyc-wallet
  r2dbc:
    url: r2dbc:h2:mem:///testdb
    username: sa
    password:

app:
  kyc:
    url: http://localhost:9080
  wallet:
    url: http://localhost:9080
resilience4j:
  circuitbreaker:
    instances:
      wallet:
        sliding-window-size: 4
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 3s
        automatic-transition-from-open-to-half-open-enabled: true


